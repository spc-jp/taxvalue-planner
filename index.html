          const textSpan = buttonElement.querySelector('span') || buttonElement;

          textSpan.innerText = "コピーしました！";
          setTimeout(() => {

        } catch (err) {

                    {step === 3 && renderStep3()}
                  </div>
                </div>
              </>
            )}
          </main>

          {renderIdeaDetail()}
        </div>
      );
    }

    /* マウント */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
